[bar.default]
center = [ "clock", "spacer_5", "clipboard" ]
end = [ "media", "spacer_4", "tray", "volume", "brightness", "network", "battery", "session" ]
margin_ends = 0
padding = 12
radius = 0
start = [ "control-center", "spacer_3", "workspaces", "spacer_2", "active_window" ]
thickness = 38

[calendar]

[control_center.calendar]
show_events_card = false

[desktop_widgets]
enabled = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 683.0
    cy = 586.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = []

[shell]
screen_time_enabled = true
show_close_buttons = false

    [shell.animation]
    speed = 0.70000001043081284

    [shell.screenshot]
    save_to_file = false

[theme]
builtin = "Tokyo-Night"
community_palette = "Everforest Material"
mode = "dark"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "gtk3", "gtk4", "niri" ]
    community_ids = [ "zen-browser", "fuzzel", "yazi" ]

[wallpaper]
directory = "/home/dasaczzz/Pictures/wallpapers"

    [wallpaper.default]
    path = "/home/dasaczzz/Pictures/wallpapers/wp1.jpg"

    [wallpaper.last]
    path = "/home/dasaczzz/Pictures/wallpapers/wp1.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/dasaczzz/Pictures/wallpapers/wp1.jpg"

[weather]
enabled = false

[widget.active_window]
icon_size = 20
max_length = 240

[widget.brightness]
show_label = false

[widget.control-center]
custom_image = "/home/dasaczzz/Pictures/system/os-icon.webp"
custom_image_colorize = true
scale = 1.25

[widget.media]
art_size = 30
hide_when_no_media = true
max_length = 200
title_scroll = "always"

[widget.network]
show_label = false

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
type = "spacer"

[widget.spacer_4]
length = 10
type = "spacer"

[widget.spacer_5]
length = 10
type = "spacer"

[widget.volume]
show_label = false
